// ── Login page ────────────────────────────────────────────────────────────────
async function showLoginPage() {
  let profiles = [];
  try { profiles = await api('GET', '/api/profiles'); } catch(_) {}

  const grid = document.getElementById('login-profiles-grid');
  if (!grid) return;

  grid.innerHTML = profiles.map(p => {
    const hasAv = p.avatar_path;
    const avInner = hasAv
      ? `<img src="/api/profiles/${p.id}/avatar?t=${Date.now()}" alt="avatar">`
      : profInitials(p);
    const lockBadge = p.has_password
      ? `<div class="login-lock-badge"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" width="9" height="9"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></div>`
      : '';
    return `
    <div class="login-profile-card ${p.is_active ? 'active-login' : ''}" id="lpc-${p.id}" style="position:relative" onclick="handleLoginCardClick(${p.id}, ${!!p.has_password})">
      <div style="position:relative;display:inline-block">
        <div class="login-av" style="background:${profColor(p.id)}">${avInner}</div>
        ${lockBadge}
      </div>
      <div>
        <div class="login-card-name">${esc(p.profile_name || 'Unnamed')}</div>
        <div class="login-card-title">${esc(p.current_title || p.full_name || 'No title')}</div>
      </div>
      ${p.is_active ? '<div class="login-card-badge">Active</div>' : ''}
    </div>`;
  }).join('') + `
  <div class="login-add-card" onclick="loginNewProfile()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="28" height="28"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    <div style="font-size:12.5px;font-weight:600">New Profile</div>
  </div>`;
}

function handleLoginCardClick(id, hasPassword) {
  if (!hasPassword) { loginAsProfile(id); return; }
  const card = document.getElementById(`lpc-${id}`);
  if (!card || card.querySelector('.login-pw-overlay')) return;
  const overlay = document.createElement('div');
  overlay.className = 'login-pw-overlay';
  overlay.innerHTML = `
    <svg viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" width="20" height="20"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
    <div style="color:#fff;font-size:12px;font-weight:600">Enter password</div>
    <input type="password" id="lpw-${id}" placeholder="Password" autocomplete="current-password">
    <div style="display:flex;gap:8px;width:100%">
      <button onclick="event.stopPropagation();submitLoginPassword(${id})" style="flex:1;background:#6366f1;color:#fff;border:none;border-radius:7px;padding:7px 0;font-size:12.5px;font-weight:600;cursor:pointer">Enter →</button>
      <button onclick="event.stopPropagation();cancelLoginPassword(${id})" style="background:rgba(255,255,255,.1);color:#fff;border:none;border-radius:7px;padding:7px 10px;font-size:12.5px;cursor:pointer">✕</button>
    </div>`;
  overlay.onclick = e => e.stopPropagation();
  card.appendChild(overlay);
  setTimeout(() => document.getElementById(`lpw-${id}`)?.focus(), 50);
  document.getElementById(`lpw-${id}`)?.addEventListener('keydown', e => {
    if (e.key === 'Enter') submitLoginPassword(id);
    if (e.key === 'Escape') cancelLoginPassword(id);
  });
}

function cancelLoginPassword(id) {
  document.getElementById(`lpc-${id}`)?.querySelector('.login-pw-overlay')?.remove();
}

async function submitLoginPassword(id) {
  const input = document.getElementById(`lpw-${id}`);
  const pw = input?.value || '';
  try {
    await api('POST', `/api/profiles/${id}/verify-password`, { password: pw });
    loginAsProfile(id);
  } catch(_) {
    const overlay = document.getElementById(`lpc-${id}`)?.querySelector('.login-pw-overlay');
    if (overlay) { overlay.style.animation = 'loginShake .3s ease'; setTimeout(() => { overlay.style.animation = ''; }, 350); }
    if (input) { input.value = ''; input.focus(); }
  }
}

async function loginAsProfile(id) {
  try { await api('POST', `/api/profiles/${id}/activate`); } catch(_) {}
  _enterApp();
}

function skipLoginPage() { _enterApp(); }

function loginNewProfile() {
  // Show an inline name-input form on the login page instead of prompt()
  const grid = document.getElementById('login-profiles-grid');
  if (!grid) return;
  grid.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0;width:100%;max-width:300px">
      <div style="color:#fff;font-size:15px;font-weight:700">New Account</div>
      <input id="login-new-name" type="text" placeholder='e.g. "Senior Backend Engineer"'
        autocomplete="off"
        style="width:100%;box-sizing:border-box;padding:11px 14px;border:1.5px solid rgba(255,255,255,.2);border-radius:8px;font-size:14px;background:rgba(255,255,255,.07);color:#fff;outline:none"
        onfocus="this.style.borderColor='rgba(99,102,241,.8)'" onblur="this.style.borderColor='rgba(255,255,255,.2)'"
        onkeydown="if(event.key==='Enter')_submitLoginNewProfile()">
      <div id="login-new-err" style="font-size:12px;color:#f87171;min-height:14px"></div>
      <button onclick="_submitLoginNewProfile()"
        style="width:100%;padding:11px;background:#6366f1;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer">
        Create &amp; Enter
      </button>
      <button onclick="showLoginPage()"
        style="background:none;border:none;color:rgba(255,255,255,.5);font-size:13px;cursor:pointer;padding:4px">
        ← Back
      </button>
    </div>`;
  setTimeout(() => document.getElementById('login-new-name')?.focus(), 50);
}

async function _submitLoginNewProfile() {
  const name = document.getElementById('login-new-name')?.value.trim();
  const errEl = document.getElementById('login-new-err');
  if (!name) { if (errEl) errEl.textContent = 'Enter a name'; return; }
  try {
    const created = await api('POST', '/api/profiles', { name });
    await api('POST', `/api/profiles/${created.id}/activate`);
    _enterApp();
  } catch(e) {
    if (errEl) errEl.textContent = e.message || 'Could not create profile';
  }
}

async function reopenLoginPage() {
  closeAccountsModal();
  sessionStorage.removeItem('jp_session');
  const lp = document.getElementById('login-page');
  lp.classList.remove('hidden');   // ← CRITICAL: re-enable pointer-events
  lp.style.opacity = '0';
  lp.style.transition = 'none';
  lp.style.display = 'flex';
  await showLoginPage();
  requestAnimationFrame(() => { lp.style.transition = 'opacity .35s'; lp.style.opacity = '1'; });
}

function _enterApp() {
  const page = document.getElementById('login-page');
  if (page) { page.classList.add('hidden'); setTimeout(() => page.style.display = 'none', 420); }
  sessionStorage.setItem('jp_session', '1');
  connectWS();
  refreshStats();
  initProfileAvatar();
  refreshConnectedSites().then(() => go('feed'));
}

// ── Init ──
(async () => {
  // Keep app shell invisible until past login so there's no flash
  document.querySelector('aside').style.visibility = 'hidden';
  document.querySelector('main').style.visibility = 'hidden';

  if (!sessionStorage.getItem('jp_session')) {
    // Fresh session — show profile picker
    const lp = document.getElementById('login-page');
    lp.classList.remove('hidden');   // re-enable pointer-events
    lp.style.display = 'flex';
    await showLoginPage();           // populates cards
    requestAnimationFrame(() => {
      lp.style.transition = 'opacity .35s';
      lp.style.opacity = '1';
    });
    // Reveal app shell behind the overlay
    document.querySelector('aside').style.visibility = '';
    document.querySelector('main').style.visibility = '';
  } else {
    // Already picked a profile this session — go straight in
    document.getElementById('login-page').style.display = 'none';
    document.querySelector('aside').style.visibility = '';
    document.querySelector('main').style.visibility = '';
    _enterApp();
  }
})();

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobPilot</title>
<style>
:root {
  color-scheme: light;
  --navy: #0F172A; --navy-mid: #1E293B; --navy-light: #334155;
  --slate: #64748B; --border: #E2E8F0; --bg: #F1F5F9;
  --white: #FFFFFF; --blue: #2563EB; --blue-light: #DBEAFE; --blue-dark: #1D4ED8;
  --green: #059669; --green-light: #D1FAE5;
  --amber: #D97706; --amber-light: #FEF3C7;
  --red: #DC2626; --red-light: #FEE2E2;
  --purple: #7C3AED; --purple-light: #EDE9FE;
  --text: #0F172A; --muted: #64748B;
  --r: 8px; --rlg: 12px;
  --sh: 0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.05);
  --shmd: 0 4px 16px rgba(15,23,42,.10);
  --font: 'Inter', system-ui, -apple-system, sans-serif;
}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}

/* Sidebar */
.sidebar{width:216px;background:var(--navy);display:flex;flex-direction:column;flex-shrink:0;height:100vh}
.brand{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand-name{font-size:17px;font-weight:700;color:#fff;letter-spacing:-.3px}
.brand-tag{font-size:11px;color:rgba(255,255,255,.35);margin-top:1px}
.nav{padding:10px 8px;flex:1}
.nav-section{font-size:10px;font-weight:600;color:rgba(255,255,255,.28);letter-spacing:.08em;text-transform:uppercase;padding:10px 10px 4px;margin-top:4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--r);color:rgba(255,255,255,.6);cursor:pointer;font-size:13.5px;font-weight:500;transition:background .13s,color .13s;margin-bottom:1px;position:relative}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:var(--blue);color:#fff}
.nav-item svg{width:15px;height:15px;flex-shrink:0}
.nav-badge{margin-left:auto;background:rgba(255,255,255,.15);color:rgba(255,255,255,.8);font-size:10px;font-weight:600;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center}
.nav-item.active .nav-badge{background:rgba(255,255,255,.25)}
.sidebar-foot{padding:12px;border-top:1px solid rgba(255,255,255,.07)}
.ws-row{display:flex;align-items:center;gap:6px;font-size:11.5px;color:rgba(255,255,255,.3)}
.ws-dot{width:7px;height:7px;border-radius:50%;background:#374151;transition:background .3s;flex-shrink:0}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 22px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-title{font-size:15px;font-weight:600}
.topbar-right{display:flex;align-items:center;gap:8px}
.content{flex:1;overflow-y:auto;padding:22px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:var(--r);font-size:13.5px;font-weight:500;cursor:pointer;border:none;transition:background .13s,opacity .13s;font-family:var(--font);white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:14px;height:14px}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--blue-dark)}
.btn-secondary{background:var(--white);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover:not(:disabled){background:var(--bg)}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover:not(:disabled){background:#047857}
.btn-danger{background:var(--red-light);color:var(--red);border:1px solid #FECACA}
.btn-sm{padding:5px 11px;font-size:12.5px}
.btn-lg{padding:11px 22px;font-size:15px;font-weight:600;border-radius:var(--rlg)}

/* Cards */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--rlg);padding:18px;box-shadow:var(--sh)}
.card-title{font-size:14.5px;font-weight:600;margin-bottom:14px}

/* Forms */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12.5px;font-weight:500;margin-bottom:5px}
.form-input,.form-select,.form-textarea{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:var(--r);font-size:13.5px;font-family:var(--font);color:var(--text);background:var(--white);outline:none;transition:border-color .13s,box-shadow .13s}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.form-textarea{resize:vertical;min-height:76px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-hint{font-size:11.5px;color:var(--muted);margin-top:3px}

/* Stats */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{background:var(--white);border:1px solid var(--border);border-radius:var(--rlg);padding:16px;box-shadow:var(--sh)}
.stat-icon{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.stat-icon svg{width:16px;height:16px}
.stat-icon.blue{background:var(--blue-light);color:var(--blue)}
.stat-icon.green{background:var(--green-light);color:var(--green)}
.stat-icon.amber{background:var(--amber-light);color:var(--amber)}
.stat-icon.purple{background:var(--purple-light);color:var(--purple)}
.stat-val{font-size:26px;font-weight:700;line-height:1}
.stat-lbl{font-size:11.5px;color:var(--muted);margin-top:3px}

/* Feed search bar */
.feed-header{background:var(--white);border:1px solid var(--border);border-radius:var(--rlg);padding:16px;margin-bottom:16px;box-shadow:var(--sh)}
.search-row{display:flex;gap:8px;margin-bottom:8px}
.search-row .form-input{flex:1}
.site-chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:flex;align-items:center;gap:6px;padding:5px 11px;border:1.5px solid var(--border);border-radius:20px;font-size:12.5px;font-weight:500;cursor:pointer;user-select:none;transition:all .13s;background:var(--white)}
.chip input{display:none}
.chip.on{border-color:var(--blue);background:var(--blue-light);color:var(--blue)}
.chip-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
/* Quick-add template chips */
.tpl-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tpl-chip{padding:3px 10px;border:1.5px solid var(--border);border-radius:14px;font-size:11.5px;font-weight:500;cursor:pointer;user-select:none;background:var(--bg);color:var(--muted);transition:all .12s}
.tpl-chip:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-light)}
/* Parsed preview pills */
.parse-preview{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;min-height:0;transition:all .2s}
.parse-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:12px;font-size:11.5px;font-weight:600;background:var(--blue-light);color:var(--blue);border:1px solid var(--blue)}
.parse-pill.loc{background:#f0fdf4;color:#16a34a;border-color:#86efac}
.parse-pill.time{background:#fefce8;color:#ca8a04;border-color:#fde047}
.parse-pill.type{background:#faf5ff;color:#9333ea;border-color:#d8b4fe}
.parse-pill.remote{background:#f0f9ff;color:#0284c7;border-color:#7dd3fc}
.parse-parsing{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}

/* Apply-all banner */
.apply-banner{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#1D4ED8,#2563EB);color:#fff;border-radius:var(--rlg);padding:14px 18px;margin-bottom:16px;box-shadow:var(--shmd)}
.apply-banner-left h3{font-size:15px;font-weight:600;margin-bottom:2px}
.apply-banner-left p{font-size:12.5px;opacity:.8}
.apply-banner-right{display:flex;gap:8px;align-items:center}

/* Progress overlay */
.progress-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:900;align-items:center;justify-content:center}
.progress-overlay.show{display:flex}
.progress-box{background:var(--white);border-radius:var(--rlg);padding:28px 32px;width:480px;max-width:calc(100vw - 32px);box-shadow:var(--shmd)}
.progress-title{font-size:17px;font-weight:700;margin-bottom:4px}
.progress-sub{font-size:13.5px;color:var(--muted);margin-bottom:20px}
.progress-track{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-bottom:8px}
.progress-fill{height:100%;background:var(--blue);border-radius:4px;transition:width .4s ease;width:0%}
.progress-label{font-size:12.5px;color:var(--muted);text-align:right;margin-bottom:14px}
.log-panel{background:var(--navy);color:rgba(255,255,255,.8);border-radius:var(--r);padding:12px 14px;font-size:12px;font-family:Menlo,Monaco,monospace;max-height:180px;overflow-y:auto;line-height:1.8}
.log-line{display:flex;gap:8px}
.log-line.success{color:#34D399}
.log-line.error{color:#F87171}
.log-line.warning{color:#FCD34D}
.log-time{color:rgba(255,255,255,.25);flex-shrink:0}

/* Job cards */
.jobs-list{display:flex;flex-direction:column;gap:9px}
.job-card{background:var(--white);border:1px solid var(--border);border-radius:var(--rlg);padding:14px 16px;display:flex;align-items:flex-start;gap:12px;transition:border-color .13s,box-shadow .13s;box-shadow:var(--sh)}
.job-card:hover{border-color:#93C5FD;box-shadow:var(--shmd)}
.job-card.selected{border-color:var(--blue);background:#F0F7FF}
.jcb{width:17px;height:17px;flex-shrink:0;margin-top:3px;accent-color:var(--blue);cursor:pointer}
.jinfo{flex:1;min-width:0}
.jtitle{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.jcomp{font-size:13px;color:var(--muted);margin-bottom:7px}
.jmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%}
.jtag{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);background:var(--bg);padding:2px 7px;border-radius:4px;border:1px solid var(--border)}
.jtag svg{width:11px;height:11px}
.badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;text-transform:capitalize}
.badge.linkedin{background:#DBEAFE;color:#1D4ED8}
.badge.naukri{background:#FEF3C7;color:#92400E}
.badge.indeed{background:#D1FAE5;color:#065F46}
.badge.glassdoor{background:#EDE9FE;color:#5B21B6}
.badge.instahyre{background:#FCE7F3;color:#9D174D}
.badge.easy{background:var(--green-light);color:var(--green)}
.badge.new{background:var(--bg);color:var(--slate);border:1px solid var(--border)}
.badge.applied{background:var(--blue-light);color:var(--blue)}
.badge.interviewing{background:var(--amber-light);color:var(--amber)}
.badge.offered{background:var(--green-light);color:var(--green)}
.badge.rejected{background:var(--red-light);color:var(--red)}
.score-pill{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:10px;border:1.5px solid}
.score-high{background:#D1FAE5;color:#065F46;border-color:#6EE7B7}
.score-mid{background:var(--amber-light);color:#92400E;border-color:#FCD34D}
.score-low{background:var(--red-light);color:var(--red);border-color:#FECACA}
.jactions{flex-shrink:0;display:flex;gap:6px;align-items:center}
.kanban-column{transition:border-color .15s,box-shadow .15s}
.kanban-column.drop-target{border-color:var(--blue)!important;box-shadow:0 0 0 3px rgba(37,99,235,.12),var(--shmd)!important}
.kanban-card{cursor:grab}
.kanban-card:active{cursor:grabbing}

/* Tabs */
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:18px}
.tab{padding:9px 14px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .13s,border-color .13s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}

/* Empty */
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty svg{width:44px;height:44px;color:var(--border);margin-bottom:10px}
.empty h3{font-size:15px;font-weight:600;color:var(--text);margin-bottom:5px}
.empty p{font-size:13.5px;max-width:280px;margin:0 auto}

/* Settings layout */
.settings-grid{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start}
.settings-nav{display:flex;flex-direction:column;gap:2px}
.settings-nav-item{padding:8px 12px;border-radius:var(--r);font-size:13.5px;font-weight:500;cursor:pointer;color:var(--muted);transition:background .13s,color .13s}
.settings-nav-item:hover{background:var(--white);color:var(--text)}
.settings-nav-item.active{background:var(--white);color:var(--blue);font-weight:600;box-shadow:var(--sh)}

/* Cred cards */
.cred-row{display:flex;flex-direction:column;gap:7px}
.cred-item{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--border);border-radius:var(--r);background:var(--white)}
.cred-logo{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.cred-info{flex:1;min-width:0}
.cred-name{font-size:13.5px;font-weight:600;text-transform:capitalize}
.cred-user{font-size:12px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot.on{background:var(--green)}
.dot.off{background:var(--border)}

/* Skills input */
.skills-wrap{display:flex;flex-wrap:wrap;gap:5px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--r);background:var(--white);cursor:text;min-height:40px}
.skill-tag{display:flex;align-items:center;gap:3px;background:var(--blue-light);color:var(--blue);font-size:12px;font-weight:500;padding:2px 7px;border-radius:4px}
.skill-tag button{border:none;background:none;color:var(--blue);cursor:pointer;font-size:13px;line-height:1;padding:0}
.skill-input{border:none;outline:none;font-size:13px;font-family:var(--font);background:transparent;min-width:100px;color:var(--text)}

/* Modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:800;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--white);border-radius:var(--rlg);padding:22px;width:460px;max-width:calc(100vw - 24px);box-shadow:var(--shmd);max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:700;margin-bottom:14px}
.modal-footer{display:flex;gap:7px;justify-content:flex-end;margin-top:18px}

/* Profile avatar + accounts modal */
.profile-av-btn{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 4px;border-radius:20px;cursor:pointer;border:1px solid transparent;transition:background .14s,border-color .14s}
.profile-av-btn:hover{background:var(--bg);border-color:var(--border)}
.profile-av-circle{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0;letter-spacing:.5px;overflow:hidden;position:relative}
.profile-av-circle img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.profile-av-name{font-size:13px;font-weight:500;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.account-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);border:2px solid var(--border);cursor:pointer;transition:border-color .15s,background .15s;margin-bottom:8px;background:var(--white)}
.account-card:hover{border-color:var(--blue);background:var(--blue-light)}
.av-upload-wrap{position:relative;cursor:pointer;display:inline-block}
.av-upload-wrap:hover .av-camera-overlay{opacity:1}
.av-camera-overlay{position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .18s;pointer-events:none}
.av-large{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:700;overflow:hidden;flex-shrink:0}
.av-large img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.account-card.active-card{border-color:var(--blue);background:var(--blue-light)}
.account-card-av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700;flex-shrink:0}
.account-card-info{flex:1;min-width:0}
.account-card-name{font-size:14px;font-weight:600;margin-bottom:2px}
.account-card-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Toast */
.toasts{position:fixed;bottom:18px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:7px}
.toast{background:var(--navy-mid);color:#fff;padding:9px 14px;border-radius:var(--r);font-size:13.5px;font-weight:500;box-shadow:var(--shmd);display:flex;align-items:center;gap:7px;max-width:310px;animation:toastIn .22s ease}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
.toast.warning{background:var(--amber)}
@keyframes toastIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* AI key status */
.ai-status{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--r);font-size:13px;font-weight:500;margin-bottom:14px}
.ai-status.ready{background:var(--green-light);color:#065F46;border:1px solid #6EE7B7}
.ai-status.missing{background:var(--amber-light);color:#92400E;border:1px solid #FCD34D}

/* Cover letter modal */
.cover-letter-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:14px;font-size:13.5px;line-height:1.7;white-space:pre-wrap;max-height:320px;overflow-y:auto;margin-bottom:14px}

/* ── Sites page ── */
.sites-grid{display:flex;flex-direction:column;gap:10px;max-width:620px}
.site-card{background:var(--white);border:1px solid var(--border);border-radius:var(--rlg);overflow:hidden;box-shadow:var(--sh);transition:box-shadow .15s,border-color .15s}
.site-card:hover{box-shadow:var(--shmd)}
.site-card.connected{border-color:var(--green)}
.site-card-header{height:5px;width:100%}
.site-card-body{padding:18px 18px 16px;display:flex;align-items:center;gap:13px}
.site-logo{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;letter-spacing:-.5px}
.site-card-info{flex:1;min-width:0}
.site-card-name{font-size:14px;font-weight:700}
.site-card-desc{font-size:11.5px;color:var(--muted);margin-top:2px}
.site-status-badge{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;flex-shrink:0;margin-top:6px}
.site-status-badge.conn{background:var(--green-light);color:#065F46}
.site-status-badge.disc{background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.site-status-badge .sdot{width:6px;height:6px;border-radius:50%;background:currentColor}
.site-card-action{flex-shrink:0}
.nb-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes loginFadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:960px){.stats-row{grid-template-columns:repeat(2,1fr)}.form-row{grid-template-columns:1fr}.settings-grid{grid-template-columns:1fr}}

/* ── Login / profile-picker page ── */
/* ── Login page ── */
#login-page{position:fixed;inset:0;z-index:10000;display:flex;flex-direction:row;transition:opacity .4s}
#login-page.hidden{opacity:0;pointer-events:none}
#login-left{flex:0 0 55%;position:relative;overflow:hidden;background:url('/static/bg_office.png') center/cover no-repeat}
#login-left-overlay{position:absolute;inset:0;background:linear-gradient(to right,rgba(10,14,40,.25) 0%,rgba(10,14,40,.55) 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:48px 44px}
#login-left-quote{color:#fff}
#login-left-quote div:first-child{font-size:36px;font-weight:800;letter-spacing:-1px;line-height:1.15;text-shadow:0 2px 12px rgba(0,0,0,.4)}
#login-left-quote div:last-child{font-size:16px;color:rgba(255,255,255,.65);margin-top:6px;font-weight:400}
#login-right{flex:1;background:linear-gradient(160deg,#0f172a 0%,#1e1b4b 60%,#0f172a 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;overflow-y:auto}
.login-brand{text-align:center;margin-bottom:36px;animation:loginFadeIn .5s ease both}
.login-brand-name{font-size:28px;font-weight:800;color:#fff;letter-spacing:-1px;margin-bottom:4px}
.login-brand-tag{font-size:13px;color:rgba(255,255,255,.45)}
.login-profiles{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:420px;animation:loginFadeIn .5s .1s ease both}
.login-profile-card{width:130px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);border-radius:16px;padding:20px 14px;display:flex;flex-direction:column;align-items:center;gap:11px;cursor:pointer;transition:background .18s,border-color .18s,transform .18s}
.login-profile-card:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);transform:translateY(-3px)}
.login-profile-card.active-login{border-color:#6366f1;background:rgba(99,102,241,.15)}
.login-av{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:700;overflow:hidden;flex-shrink:0}
.login-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.login-card-name{font-size:13px;font-weight:600;color:#fff;text-align:center;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.login-card-title{font-size:11px;color:rgba(255,255,255,.5);text-align:center;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.login-card-badge{font-size:10px;font-weight:700;background:#6366f1;color:#fff;padding:2px 8px;border-radius:8px}
.login-add-card{width:130px;background:transparent;border:1.5px dashed rgba(255,255,255,.2);border-radius:16px;padding:20px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;color:rgba(255,255,255,.4);transition:border-color .18s,color .18s}
.login-add-card:hover{border-color:rgba(255,255,255,.5);color:rgba(255,255,255,.7)}
.login-footer{margin-top:28px;font-size:12px;color:rgba(255,255,255,.3);text-align:center;animation:loginFadeIn .5s .2s ease both}
.login-lock-badge{position:absolute;top:-4px;right:-4px;width:18px;height:18px;background:#f59e0b;border-radius:50%;display:flex;align-items:center;justify-content:center}
.login-pw-overlay{position:absolute;inset:0;border-radius:14px;background:rgba(15,23,42,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;animation:loginFadeIn .18s ease}
.login-pw-overlay input{width:100%;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.25);border-radius:8px;padding:8px 10px;color:#fff;font-size:13px;outline:none;text-align:center;letter-spacing:2px}
.login-pw-overlay input::placeholder{letter-spacing:normal;color:rgba(255,255,255,.4)}
.login-pw-overlay input:focus{border-color:#6366f1}
@keyframes loginShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(max-width:700px){#login-left{display:none}#login-right{flex:1}}
</style>
</head>
<body>

<!-- ── Login / Profile-picker page ── -->
<div id="login-page" class="hidden" style="opacity:0">
  <!-- Left: hero image -->
  <div id="login-left">
    <div id="login-left-overlay">
      <div id="login-left-quote">
        <div>Better Jobs.<br>Brighter Futures.</div>
        <div>AI-powered job search that works while you sleep.</div>
      </div>
    </div>
  </div>
  <!-- Right: profile picker -->
  <div id="login-right">
    <div class="login-brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" width="32" height="32" style="margin-bottom:8px"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.67A2 2 0 012 0h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 14h-.08z"/></svg>
      <div class="login-brand-name">JobPilot</div>
      <div class="login-brand-tag">Choose your account to continue</div>
    </div>
    <div class="login-profiles" id="login-profiles-grid">
      <!-- Populated by JS -->
    </div>
    <div class="login-footer">· <span style="color:rgba(255,255,255,.45);cursor:pointer" onclick="skipLoginPage()">Skip →</span></div>
  </div>
</div>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="brand">
    <div class="brand-name">JobPilot</div>
    <div class="brand-tag">AI-Powered Job Search</div>
  </div>
  <nav class="nav">
    <div class="nav-item active" onclick="go('feed')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Job Feed
      <span class="nav-badge" id="nb-jobs">0</span>
    </div>
    <div class="nav-item" onclick="go('tracker')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Applications
      <span class="nav-badge" id="nb-apps">0</span>
    </div>
    <div class="nav-section">Setup</div>
    <div class="nav-item" onclick="go('sites')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      Job Sites
      <span class="nav-badge" id="nb-sites">0</span>
    </div>
    <div class="nav-item" onclick="go('settings')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      Settings
    </div>
  </nav>
  <div class="sidebar-foot">
    <div class="ws-row">
      <div class="ws-dot" id="ws-dot"></div>
      <span id="ws-lbl">Connecting…</span>
    </div>
  </div>
</aside>

<!-- Main -->
<main class="main">
  <div class="topbar">
    <div class="topbar-title" id="page-title">Job Feed</div>
    <div style="display:flex;align-items:center;gap:6px">
      <div id="topbar-right"></div>
      <div class="profile-av-btn" id="profile-av-btn" onclick="openAccountsModal()" title="Switch profile">
        <div class="profile-av-circle" id="profile-av-circle" style="background:#6366f1">?</div>
        <span class="profile-av-name" id="profile-av-name"></span>
      </div>
    </div>
  </div>
  <div class="content" id="content"></div>
</main>

<!-- Accounts / Profiles modal -->
<div class="overlay" id="accounts-modal" onclick="if(event.target===this)closeAccountsModal()">
  <div class="modal" style="width:440px;max-height:85vh;overflow-y:auto" onclick="event.stopPropagation()">
    <!-- Header -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <div class="modal-title" style="margin-bottom:0">My Profiles</div>
      <button onclick="closeAccountsModal()" style="background:none;border:none;cursor:pointer;color:var(--muted);font-size:22px;line-height:1;padding:0 4px">&times;</button>
    </div>

    <!-- Active profile editor -->
    <div id="accounts-modal-editor" style="background:var(--bg);border-radius:var(--r);padding:18px;margin-bottom:20px;border:1px solid var(--border)"></div>

    <!-- Divider -->
    <div style="font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:10px">All Profiles</div>

    <!-- Profile list -->
    <div id="accounts-modal-list"></div>

    <!-- Create button -->
    <button class="btn" style="width:100%;justify-content:center;margin-top:8px" onclick="newAccountFromModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      Create New Profile
    </button>

    <!-- Switch account (re-show login page) -->
    <div style="text-align:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">
      <button onclick="reopenLoginPage()" style="background:none;border:none;font-size:12.5px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:5px" onmouseenter="this.style.color='var(--text)'" onmouseleave="this.style.color='var(--muted)'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Switch to a different account
      </button>
    </div>
  </div>
</div>

<!-- Apply-all progress overlay -->
<div class="progress-overlay" id="apply-overlay">
  <div class="progress-box">
    <div class="progress-title">Applying to jobs…</div>
    <div class="progress-sub" id="po-sub">Preparing…</div>
    <div class="progress-track"><div class="progress-fill" id="po-fill"></div></div>
    <div class="progress-label" id="po-label"></div>
    <div class="log-panel" id="po-log"></div>
    <div style="margin-top:14px;text-align:right">
      <button class="btn btn-secondary btn-sm" onclick="document.getElementById('apply-overlay').classList.remove('show')">Close</button>
    </div>
  </div>
</div>

<!-- Generic modal -->
<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-box"></div>
</div>

<!-- Toasts -->
<div class="toasts" id="toasts"></div>

<script>
const API = 'http://127.0.0.1:8765';
let ws = null;
let jobs = [], applications = [], stats = {}, profileSkills = [];
let lastSearchKw = '';
let connectedSites = new Set(); // sites that have saved credentials
let jobMatchScores = {};
let scoringRun = 0;

// ── Profile / Account helpers ──────────────────────────────────────────────
const _PROF_COLORS = ['#6366f1','#8b5cf6','#10b981','#f59e0b','#ef4444','#3b82f6','#ec4899','#14b8a6'];
function profColor(id) { return _PROF_COLORS[((id || 1) - 1) % _PROF_COLORS.length]; }
function profInitials(p) {
  const n = p.full_name || p.profile_name || '';
  return n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('') || '?';
}
function profAvatarHTML(p, size = 30, large = false) {
  const cls = large ? 'av-large' : 'profile-av-circle';
  const hasAvatar = p && p.id && p.avatar_path;
  if (hasAvatar) {
    return `<div class="${cls}" style="background:${profColor(p.id)}"><img src="/api/profiles/${p.id}/avatar?t=${Date.now()}" alt="avatar"></div>`;
  }
  return `<div class="${cls}" style="background:${profColor(p.id)}">${profInitials(p)}</div>`;
}

async function initProfileAvatar() {
  try {
    const p = await api('GET', '/api/profile');
    const btn = document.getElementById('profile-av-btn');
    const nameEl = document.getElementById('profile-av-name');
    if (btn) {
      // Replace the inner circle with fresh avatar HTML
      const old = document.getElementById('profile-av-circle');
      if (old) {
        const newCircle = document.createElement('div');
        newCircle.id = 'profile-av-circle';
        newCircle.className = 'profile-av-circle';
        newCircle.style.background = profColor(p.id);
        if (p.avatar_path) {
          newCircle.innerHTML = `<img src="/api/profiles/${p.id}/avatar?t=${Date.now()}" alt="avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
        } else {
          newCircle.textContent = profInitials(p);
        }
        old.replaceWith(newCircle);
      }
    }
    if (nameEl) nameEl.textContent = p.profile_name || p.full_name || 'Profile';
  } catch(_) {}
}

async function openAccountsModal() {
  let profiles = [], active = {};
  try { profiles = await api('GET', '/api/profiles'); } catch(_) {}
  try { active = await api('GET', '/api/profile') || {}; } catch(_) {}

  // ── Editor section (active profile) ──
  const editor = document.getElementById('accounts-modal-editor');
  if (editor) {
    const hasAvatar = active.avatar_path;
    editor.innerHTML = `
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:16px">
        <!-- Avatar with upload overlay -->
        <div class="av-upload-wrap" onclick="triggerAvatarUpload(${active.id})">
          ${hasAvatar
            ? `<div class="av-large" style="background:${profColor(active.id)}"><img src="/api/profiles/${active.id}/avatar?t=${Date.now()}" alt="avatar"></div>`
            : `<div class="av-large" style="background:${profColor(active.id)}">${profInitials(active)}</div>`
          }
          <div class="av-camera-overlay">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" width="20" height="20"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
          </div>
          <input type="file" id="avatar-file-input" accept="image/*" style="display:none" onchange="uploadAvatarFile(${active.id}, this)">
        </div>
        <!-- Editable name + title -->
        <div style="flex:1;min-width:0">
          <input id="acct-edit-name" value="${esc(active.profile_name || '')}" placeholder="Profile name" style="width:100%;border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:14px;font-weight:600;background:var(--white);color:var(--text);margin-bottom:7px;box-sizing:border-box">
          <input id="acct-edit-title" value="${esc(active.current_title || '')}" placeholder="Current title (e.g. Senior Data Engineer)" style="width:100%;border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--white);color:var(--text);box-sizing:border-box">
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary" style="font-size:12.5px;height:32px" onclick="saveAccountEdit(${active.id})">Save changes</button>
        <span style="font-size:12px;color:var(--muted);line-height:32px">Editing active profile</span>
      </div>`;
  }

  // ── Profile list ──
  const list = document.getElementById('accounts-modal-list');
  if (list) {
    list.innerHTML = profiles.map(p => {
      const hasAv = p.avatar_path;
      const avHtml = hasAv
        ? `<div class="account-card-av" style="background:${profColor(p.id)};border-radius:50%;overflow:hidden;width:38px;height:38px;flex-shrink:0"><img src="/api/profiles/${p.id}/avatar?t=${Date.now()}" style="width:100%;height:100%;object-fit:cover"></div>`
        : `<div class="account-card-av" style="background:${profColor(p.id)}">${profInitials(p)}</div>`;
      return `
      <div class="account-card ${p.is_active ? 'active-card' : ''}" onclick="switchAccountFromModal(${p.id})">
        ${avHtml}
        <div class="account-card-info">
          <div class="account-card-name">${esc(p.profile_name || 'Unnamed')}</div>
          <div class="account-card-sub">${esc(p.current_title || p.full_name || 'No title set')}</div>
        </div>
        ${p.is_active ? '<span style="background:var(--blue);color:#fff;font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:10px;flex-shrink:0">Active</span>' : ''}
        <button onclick="event.stopPropagation();deleteAccountById(${p.id})" title="Delete" style="background:none;border:none;cursor:pointer;color:var(--muted);font-size:18px;padding:2px 5px;border-radius:4px;flex-shrink:0" onmouseenter="this.style.color='var(--red)'" onmouseleave="this.style.color='var(--muted)'">&times;</button>
      </div>`;
    }).join('');
  }

  document.getElementById('accounts-modal').classList.add('open');
}

function closeAccountsModal() {
  document.getElementById('accounts-modal').classList.remove('open');
}

async function saveAccountEdit(profileId) {
  const name  = document.getElementById('acct-edit-name')?.value.trim();
  const title = document.getElementById('acct-edit-title')?.value.trim();
  if (!name) { toast('Profile name cannot be empty', 'error'); return; }
  try {
    await api('POST', '/api/profile', { profile_name: name, current_title: title });
    await initProfileAvatar();
    toast('Profile updated', 'success');
    if (currentPage === 'settings') renderProfileTab();
  } catch(e) { toast('Failed: ' + e.message, 'error'); }
}

function triggerAvatarUpload(profileId) {
  // Account tab uses a distinct id to avoid clashing with the modal's input
  const el = document.getElementById('avatar-file-input-acct')
           || document.getElementById('avatar-file-input');
  el?.click();
}

async function uploadAvatarFile(profileId, input) {
  const file = input.files[0];
  if (!file) return;
  const form = new FormData();
  form.append('file', file);
  try {
    const res = await fetch(`${API}/api/profiles/${profileId}/avatar`, { method: 'POST', body: form });
    if (!res.ok) throw new Error(await res.text());
    // Mark avatar_path as truthy in DB — the endpoint already does this,
    // just refresh the UI
    await initProfileAvatar();
    toast('Profile picture updated', 'success');
    openAccountsModal(); // refresh modal to show new avatar
    if (currentPage === 'settings') renderProfileTab();
  } catch(e) { toast('Upload failed: ' + e.message, 'error'); }
}

async function switchAccountFromModal(id) {
  let profiles = [];
  try { profiles = await api('GET', '/api/profiles'); } catch(_) {}
  const target = profiles.find(p => p.id === id);
  if (!target) return;
  if (target.is_active) { closeAccountsModal(); return; } // already active
  if (target.has_password) {
    _showModalPasswordScreen(target);
    return;
  }
  await _doSwitchAccount(id);
}

function _showModalPasswordScreen(profile) {
  const avHtml = profile.avatar_path
    ? `<div class="av-large" style="background:${profColor(profile.id)};width:64px;height:64px;font-size:22px"><img src="/api/profiles/${profile.id}/avatar?t=${Date.now()}" alt="avatar"></div>`
    : `<div class="av-large" style="background:${profColor(profile.id)};width:64px;height:64px;font-size:22px">${profInitials(profile)}</div>`;

  const container = document.getElementById('accounts-modal-list');
  container.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;padding:8px 0 4px">
      ${avHtml}
      <div style="font-size:15px;font-weight:700;margin-top:10px">${esc(profile.profile_name || 'Profile')}</div>
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:18px">${esc(profile.current_title || '')}</div>
      <div style="width:100%;max-width:280px">
        <div style="position:relative;margin-bottom:10px">
          <input id="modal-pw-input" type="password" placeholder="Password" autocomplete="current-password"
            style="width:100%;box-sizing:border-box;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;background:var(--white);color:var(--text);outline:none"
            onfocus="this.style.borderColor='var(--blue)'" onblur="this.style.borderColor='var(--border)'"
            onkeydown="if(event.key==='Enter')_submitModalPassword(${profile.id})">
        </div>
        <div id="modal-pw-err" style="font-size:12px;color:var(--red);min-height:16px;margin-bottom:8px;text-align:center"></div>
        <button class="btn btn-primary" style="width:100%;height:40px;font-size:14px;font-weight:600" onclick="_submitModalPassword(${profile.id})">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14" style="margin-right:6px"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          Unlock
        </button>
        <button onclick="openAccountsModal()" style="width:100%;margin-top:8px;background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:6px">← Back to accounts</button>
      </div>
    </div>`;
  setTimeout(() => document.getElementById('modal-pw-input')?.focus(), 50);
}

async function _submitModalPassword(id) {
  const pw = document.getElementById('modal-pw-input')?.value || '';
  const errEl = document.getElementById('modal-pw-err');
  if (!pw) { if (errEl) errEl.textContent = 'Enter your password'; return; }
  try {
    await api('POST', `/api/profiles/${id}/verify-password`, { password: pw });
    await _doSwitchAccount(id);
  } catch(_) {
    if (errEl) errEl.textContent = 'Incorrect password';
    const inp = document.getElementById('modal-pw-input');
    if (inp) { inp.value = ''; inp.style.borderColor = 'var(--red)'; inp.focus(); setTimeout(() => inp.style.borderColor = 'var(--border)', 1200); }
  }
}

async function _doSwitchAccount(id) {
  try {
    await api('POST', `/api/profiles/${id}/activate`);
    closeAccountsModal();
    await initProfileAvatar();
    toast('Account switched', 'success');
    if (currentPage === 'settings') renderProfileTab();
  } catch(e) { toast('Failed: ' + e.message, 'error'); }
}

function _showModalNewProfile() {
  const container = document.getElementById('accounts-modal-list');
  container.innerHTML = `
    <div style="padding:4px 0">
      <div style="font-size:13.5px;font-weight:600;margin-bottom:10px">New account name</div>
      <input id="modal-new-name" type="text" placeholder='e.g. "Senior Backend Engineer"'

// ── WebSocket ──
function connectWS() {
  ws = new WebSocket(`ws://127.0.0.1:8765/ws/logs`);
  ws.onopen = () => { setWS(true); };
  ws.onclose = () => { setWS(false); setTimeout(connectWS, 3000); };
  ws.onmessage = e => handleWS(JSON.parse(e.data));
}
function setWS(on) {
  document.getElementById('ws-dot').style.background = on ? '#22C55E' : '#374151';
  document.getElementById('ws-lbl').textContent = on ? 'Live' : 'Disconnected';
}
async function handleWS(d) {
  if (d.type === 'log') {
    appendLog(d.message, d.level, 'po-log');
    appendLog(d.message, d.level, 'inline-log');
  }
  if (d.type === 'search_result') {
    // Update chip to show live count
    const chip = document.getElementById(`chip-${d.site}`);
    if (chip) {
      const existing = chip.querySelector('.chip-count');
      if (existing) existing.remove();
      if (d.count > 0) {
        const span = document.createElement('span');
        span.className = 'chip-count';
        span.style.cssText = 'background:var(--blue);color:#fff;border-radius:8px;padding:0 5px;font-size:10px;font-weight:700;margin-left:2px';
        span.textContent = d.count;
        chip.appendChild(span);
      }
    }
    appendLog(`${d.site}: ${d.count} job${d.count === 1 ? '' : 's'} found`, d.count > 0 ? 'success' : 'warning', 'inline-log');
    // Reload jobs list live after each site completes
    if (currentPage === 'feed') loadFeedJobs();
  }
  if (d.type === 'search_done') {
    const newFound = d.total || 0;
    appendLog(`✓ Found ${newFound} job${newFound === 1 ? '' : 's'} this run`, newFound > 0 ? 'success' : 'warning', 'inline-log');
    resetSearchBtn();
    refreshStats();
    if (currentPage === 'feed') {
      await loadFeedJobs();
      // Show apply banner so user can kick off apply step
      if (newFound > 0) {
        const banner = document.getElementById('apply-banner');
        if (banner) banner.style.display = 'flex';
      }
    }
    setTimeout(() => { const il = document.getElementById('inline-log'); if (il) il.style.display = 'none'; }, 5000);
  }
  if (d.type === 'apply_all_start') {
    applyTotal = d.total; applyDone = 0;
    showOverlay();
    setProgress(0, `Starting — ${d.total} jobs to apply…`);
  }
  if (d.type === 'apply_all_progress') {
    applyDone = d.current;
    setProgress(d.current / d.total, `${d.current}/${d.total} — ${d.job}`);
    appendLog(`Applying: ${d.job}`, 'info', 'po-log');
  }
  if (d.type === 'apply_all_done') {
    const msg = d.stopped
      ? `Stopped — ${d.applied} applied before stop`
      : `Done — ${d.applied} applied, ${d.skipped} skipped`;
    setProgress(1, msg);
    if (!d.stopped) toast(`Applied to ${d.applied} job${d.applied === 1 ? '' : 's'}!`, 'success');
    else toast(`Stopped after ${d.applied} application${d.applied === 1 ? '' : 's'}`, 'warning');
    // Reset apply-all button
    const applyBtn = document.getElementById('apply-all-btn');
    if (applyBtn) { applyBtn.disabled = false; applyBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg> Apply All New (<span id="new-count">0</span>)'; }
    // Hide stop btn (only relevant during apply, not search)
    const stop = document.getElementById('stop-btn');
    if (stop) stop.style.display = 'none';
    refreshStats();
    if (currentPage === 'feed') loadFeedJobs();
    resetSearchBtn();
    setTimeout(() => {
      const il = document.getElementById('inline-log');
      if (il) il.style.display = 'none';
    }, 6000);
  }
  if (d.type === 'apply_stopped') {
    toast('Stopping after current job…', 'warning');
  }
  if (d.type === 'applied') {
    if (d.success) toast('Application submitted!', 'success');
    else toast('Opened in browser — complete manually', 'warning');
  }
}

// ── Progress overlay ──
function showOverlay() { document.getElementById('apply-overlay').classList.add('show'); document.getElementById('po-log').innerHTML = ''; }
function setProgress(pct, label) {
  document.getElementById('po-fill').style.width = (pct * 100) + '%';
  document.getElementById('po-label').textContent = label;
  if (pct >= 1) { document.getElementById('po-sub').textContent = 'Finished!'; }
  else { document.getElementById('po-sub').textContent = 'This may take a few minutes…'; }
}

function appendLog(msg, level = 'info', containerId = 'po-log') {
  const el = document.getElementById(containerId);
  if (!el) return;
  const row = document.createElement('div');
  row.className = `log-line ${level}`;
  const t = new Date().toLocaleTimeString('en', {hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  row.innerHTML = `<span class="log-time">${t}</span><span>${esc(msg)}</span>`;
  el.appendChild(row);
  el.scrollTop = el.scrollHeight;
}

// ── API ──
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  if (!r.ok) { const e = await r.json().catch(() => ({ detail: r.statusText })); throw new Error(e.detail || 'Error'); }
  return r.json();
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function scoreClass(score) {
  if (score >= 80) return 'score-high';
  if (score >= 60) return 'score-mid';
  return 'score-low';
}

async function enrichJobScores() {
  const run = ++scoringRun;
  const ids = [...new Set(jobs.map(job => job.id).filter(Boolean))];
  if (!ids.length) return;

  const pending = ids.filter(id => !(id in jobMatchScores));
  for (let offset = 0; offset < pending.length; offset += 12) {
    if (run !== scoringRun) return;
    const batch = pending.slice(offset, offset + 12);
    try {
      const response = await api('POST', '/api/ai/score-jobs', { job_ids: batch });
      const results = Array.isArray(response?.results) ? response.results : [];
      results.forEach(item => {
        jobMatchScores[item.id] = Number(item.score ?? 0);
        const idx = jobs.findIndex(job => job.id === item.id);
        if (idx >= 0) {
          jobs[idx].match_score = Number(item.score ?? 0);
          jobs[idx].match_reasons = Array.isArray(item.reasons) ? item.reasons : [];
        }
      });
      filterJobs();
    } catch (_) {
      // Keep already-scored jobs visible if a later batch fails.
      return;
    }
    // Yield to rendering and user input before starting the next batch.
    await new Promise(resolve => setTimeout(resolve, 0));
  }
}

  const el = document.createElement('div');
  el.className = `toast ${type}`;

  c.appendChild(el);

}

function showParsedPreview(parsed) {
  const el = document.getElementById('parse-preview');
  if (!el) return;

  if (parsed.location)        html += `<span class="parse-pill loc">📍 ${esc(parsed.location)}</span>`;
  if (parsed.freshness && parsed.freshness !== 'any') html += `<span class="parse-pill time">⏱ ${freshnessLabel[parsed.freshness] || parsed.freshness}</span>`;
  if (parsed.job_type)        html += `<span class="parse-pill type">💼 ${esc(parsed.job_type)}</span>`;
  if (parsed.remote)          html += `<span class="parse-pill remote">🏠 Remote</span>`;
  if (parsed.min_experience > 0) html += `<span class="parse-pill type">🎓 ${parsed.min_experience}+ yrs exp</span>`;

  el.style.display = html ? 'flex' : 'none';

// ── Main search ───────────────────────────────────────────────────────────
async function runSearch() {
  const nlInput = document.getElementById('f-nl');
  const query = nlInput ? nlInput.value.trim() : '';
  const sites = [...document.querySelectorAll('.chip input:checked')].map(i => i.value);

  if (!query) { toast('Enter what you\'re looking for', 'warning'); nlInput && nlInput.focus(); return; }
  if (!sites.length) { toast('Select at least one site', 'warning'); return; }

  const btn  = document.getElementById('search-btn');
  const stop = document.getElementById('stop-btn');

  // ── Step 1: AI parse the natural language query ──────────────────────────
  let parsed = { keywords: query, location: '', freshness: 'any', job_type: '', remote: false };
  showParsingSpinner();
  try {
    parsed = await api('POST', '/api/ai/parse-search', { query });
  } catch(_) {
    // AI unavailable or key not set — treat full query as keywords
    parsed.keywords = query;
  }
  showParsedPreview(parsed);

  const kw  = parsed.keywords || query;
  const loc = parsed.location || '';
  lastSearchKw = kw;   // remember for post-search filter sync

  // Map freshness → filter-date value so the date filter is auto-set after search
  const freshnessToFilter = { '24h': '1', '3d': '3', '7d': '7', '30d': '30', 'any': '' };
  const dateFilterVal = freshnessToFilter[parsed.freshness] || '';

  // ── Step 2: Kick off the actual scraping ─────────────────────────────────
  if (btn)  { btn.disabled = true; btn.style.display = 'none'; }
  if (stop) { stop.style.display = ''; stop.disabled = false; }

  const il = document.getElementById('inline-log');
  if (il) { il.style.display = 'block'; il.innerHTML = ''; }
  document.querySelectorAll('.chip-count').forEach(el => el.remove());

  const filters = {};
  if (parsed.job_type) filters.job_type = parsed.job_type;
  if (parsed.freshness && parsed.freshness !== 'any') filters.freshness = parsed.freshness;
  if (parsed.remote) filters.remote = true;
  if (parsed.min_experience > 0) filters.min_experience = parsed.min_experience;
  appendLog(`Searching "${kw}"${loc ? ' in ' + loc : ''}${parsed.freshness !== 'any' ? ' · ' + parsed.freshness : ''} on: ${sites.join(', ')}`, 'info', 'inline-log');

  try {
    const results_limit = parseInt(document.getElementById('f-limit')?.value || '25', 10);
    await api('POST', '/api/search', { keywords: kw, location: loc, sites, filters, results_limit });
    // search_done WS event will reload jobs and reset button
    // Auto-apply the parsed date filter after results load
    if (dateFilterVal) {
      setTimeout(() => {
        const fd = document.getElementById('filter-date');
        if (fd) { fd.value = dateFilterVal; filterJobs(); }
      }, 800);
    }
  } catch(e) {
    toast(e.message, 'error');
    resetSearchBtn();
  }
}

async function loadFeedJobs() {

    // After a search, reset all filters and apply only the search keyword
    // so the user immediately sees the results without restrictive stale filters
    if (lastSearchKw) {

function timeAgo(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr.includes('T') && !isoStr.endsWith('Z') ? isoStr + 'Z' : isoStr);
  const diff = Date.now() - d.getTime();
  if (isNaN(diff) || diff < 0) return '';
  const mins = Math.floor(diff / 60000);
  if (mins < 2) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  // For anything older than 1 hour, show the actual date
  return formatDate(d);
}

function formatDate(d) {
  if (!(d instanceof Date)) d = new Date(d);
  if (isNaN(d)) return '';
  const now = new Date();
  const isThisYear = d.getFullYear() === now.getFullYear();
  const opts = isThisYear
    ? { month: 'short', day: 'numeric' }
    : { month: 'short', day: 'numeric', year: 'numeric' };
  return d.toLocaleDateString('en-US', opts);
}

function filterJobs() {
  const kw      = (document.getElementById('filter-kw')?.value||'').toLowerCase();
  const site    = document.getElementById('filter-site')?.value||'';
  const days    = parseInt(document.getElementById('filter-date')?.value||'0');
  const sort    = document.getElementById('filter-sort')?.value||'newest';
  const easyOnly = document.getElementById('filter-easy')?.checked;
  const newOnly  = document.getElementById('filter-new')?.checked;
  const cutoff   = days ? Date.now() - days * 86400000 : 0;

  let filtered = jobs.filter(j => {
    if (kw && !((j.title||'').toLowerCase().includes(kw) || (j.company||'').toLowerCase().includes(kw))) return false;
    if (site && j.site !== site) return false;
    if (easyOnly && !j.easy_apply) return false;
    if (newOnly && j.status === 'applied') return false;
    if (cutoff) {
      // Prefer actual posting date; fall back to scrape date
      const raw = (j.date_posted && j.date_posted.length > 5) ? j.date_posted : j.date_found;
      if (raw) {
        const t = new Date(raw.endsWith('Z') ? raw : raw + 'Z').getTime();
        if (t < cutoff) return false;
      }
    }
    return true;
  });

  // Sort
  if (sort === 'newest')  filtered.sort((a,b) => (b.date_found||'').localeCompare(a.date_found||''));
  if (sort === 'oldest')  filtered.sort((a,b) => (a.date_found||'').localeCompare(b.date_found||''));
  if (sort === 'company') filtered.sort((a,b) => (a.company||'').localeCompare(b.company||''));
  if (sort === 'title')   filtered.sort((a,b) => (a.title||'').localeCompare(b.title||''));

  // Update filter summary
  const active = [kw&&'keyword', site&&'site', days&&'date', easyOnly&&'Easy Apply', newOnly&&'not applied'].filter(Boolean);
  const sum = document.getElementById('filter-summary');
  if (sum) {
    if (active.length) {
      sum.style.display = 'block';
      sum.innerHTML = `Showing <strong>${filtered.length}</strong> of ${jobs.length} jobs &nbsp;·&nbsp; Filtered by: ${active.join(', ')} &nbsp;<button onclick="clearFilters()" style="background:none;border:none;color:var(--blue);cursor:pointer;font-size:11.5px;padding:0">Clear filters</button>`;
    } else {
      sum.style.display = filtered.length < jobs.length ? 'block' : 'none';
      if (filtered.length < jobs.length) sum.textContent = `Showing ${filtered.length} of ${jobs.length} jobs`;
    }
  }

  renderJobCards(filtered);
  updateApplyBanner(filtered);
}

  const nw   = document.getElementById('filter-new');  if (nw)   nw.checked  = true;

function selectAll() {
  document.querySelectorAll('.jcb').forEach(cb => {
    const id = parseInt(cb.closest('.job-card').id.replace('jc-',''));

    const r = await api('POST', `/api/jobs/${jobId}/apply`);

async function updateApp(id, status) {
  try { await api('PATCH', `/api/applications/${id}`, { status }); toast('Status updated', 'success'); refreshStats(); }
  catch(e) { toast(e.message, 'error'); }
}

async function updateJobStatus(jobId, status) {
  const job = jobs.find(item => item.id === jobId);
  const previousStatus = job?.status || 'new';
  if (job && previousStatus === status) return;

  if (job) job.status = status;
  try {
    await api('PATCH', `/api/jobs/${jobId}/status`, { status });
    toast('Pipeline stage updated', 'success');
    refreshStats();
  } catch (e) {
    if (job) job.status = previousStatus;
    await loadPipeline();
    toast(e.message, 'error');
  }
}

let draggedKanbanJobId = null;
let draggedKanbanCard = null;
let draggedKanbanColumn = null;

function dragKanbanCard(event, jobId) {
  draggedKanbanJobId = jobId;
  draggedKanbanCard = event.currentTarget;
  draggedKanbanColumn = event.currentTarget.closest('.kanban-column');
  event.dataTransfer.effectAllowed = 'move';
  event.dataTransfer.setData('text/plain', String(jobId));
  event.currentTarget.style.opacity = '0.55';
}

function endKanbanDrag(event) {
  event.currentTarget.style.opacity = '';
  draggedKanbanJobId = null;
  draggedKanbanCard = null;
  draggedKanbanColumn = null;
  document.querySelectorAll('.kanban-column.drop-target').forEach(column => column.classList.remove('drop-target'));
}

function allowKanbanDrop(event) {
  event.preventDefault();
  event.dataTransfer.dropEffect = 'move';
  event.currentTarget.classList.add('drop-target');
}

function leaveKanbanDrop(event) {
  if (!event.currentTarget.contains(event.relatedTarget)) {
    event.currentTarget.classList.remove('drop-target');
  }
}

function dropKanbanCard(event, status) {
  event.preventDefault();
  event.currentTarget.classList.remove('drop-target');
  const jobId = draggedKanbanJobId || parseInt(event.dataTransfer.getData('text/plain'), 10);
  if (!jobId) return;
  const job = jobs.find(item => item.id === jobId);
  if (!job || (job.status || 'new') === status) return;

  const body = event.currentTarget.querySelector('[style*="min-height"]');
  if (draggedKanbanCard && body) {
    const emptyState = body.querySelector(':scope > div:not(.kanban-card)');
    if (emptyState) emptyState.remove();
    body.appendChild(draggedKanbanCard);
    updateKanbanCount(event.currentTarget);
    if (draggedKanbanColumn) updateKanbanCount(draggedKanbanColumn);
  }
  updateJobStatus(jobId, status);
}

function updateKanbanCount(column) {
  const count = column.querySelector('div[style*="border-bottom"] span:last-child');
  const body = column.querySelector('[style*="min-height"]');
  if (count && body) count.textContent = body.querySelectorAll('.kanban-card').length;
}

const PREVIEW_PALETTE = [
  ['#6366f1','#eef2ff'],['#1D4ED8','#DBEAFE'],['#065F46','#D1FAE5'],
  ['#92400E','#FEF3C7'],['#5B21B6','#EDE9FE'],['#9D174D','#FCE7F3'],
  ['#7C2D12','#FED7AA'],['#134E4A','#CCFBF1'],
];
let _previewPaletteIdx = 0;

function toggleAddSiteForm() {
  const f = document.getElementById('add-site-form');
  const t = document.getElementById('add-site-trigger');
  const open = f && f.style.display !== 'none';
  if (f) f.style.display = open ? 'none' : 'block';
  if (t) t.style.display = open ? 'flex' : 'none';
  if (!open) { updateSitePreview(); }
}

function prefillSite(name, url, search) {
  const ni = document.getElementById('ns-name');
  const ui = document.getElementById('ns-url');
  const si = document.getElementById('ns-search');
  if (ni) ni.value = name;
  if (ui) ui.value = url;
  if (si) si.value = search;
  updateSitePreview();
}

function updateSitePreview() {
  const name = document.getElementById('ns-name')?.value.trim() || 'Your Site';
  const url = document.getElementById('ns-url')?.value.trim().replace(/^https?:\/\//, '') || 'example.com';
  const words = name.split(/\s+/);
  const label = words.length > 1
    ? (words[0][0] + words[1][0]).toUpperCase()
    : name.slice(0, 2).toUpperCase();
  // Pick color deterministically from name char codes
  const idx = name.charCodeAt(0) % PREVIEW_PALETTE.length;
  const [color, bg] = PREVIEW_PALETTE[idx];
  const prevName = document.getElementById('prev-name');
  const prevUrl  = document.getElementById('prev-url');
  const prevLogo = document.getElementById('prev-logo');
  const prevHdr  = document.getElementById('prev-header');
  if (prevName) prevName.textContent = name;
  if (prevUrl)  prevUrl.textContent  = url;
  if (prevLogo) { prevLogo.textContent = label; prevLogo.style.background = bg; prevLogo.style.color = color; }
  if (prevHdr)  prevHdr.style.background = color;
}

async function saveCustomSite() {
  const name   = document.getElementById('ns-name')?.value.trim();
  const url    = document.getElementById('ns-url')?.value.trim();
  const search = document.getElementById('ns-search')?.value.trim();
  if (!name || !url || !search) { toast('Please fill in all three fields', 'error'); return; }
  const btn = document.querySelector('#add-site-form .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Adding…'; }
  try {
    await api('POST', '/api/sites/custom', { name, base_url: url, search_url: search });
    toast(`${name} added! ✓`, 'success');
    await renderSites();
  } catch(e) {
    toast(`Error: ${e.message}`, 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Add Site'; }
  }
}

async function deleteCustomSite(key, name) {
  if (!confirm(`Remove "${name}" from your job sites?`)) return;
  try {
    await api('DELETE', `/api/sites/custom/${key}`);
    toast(`${name} removed`, 'success');
    await renderSites();
  } catch(e) { toast(e.message, 'error'); }
}

  return SITE_DEFS[site]?.name || site;

async function siteConnect(site, isCustom = false) {
  const btn = document.getElementById(`site-btn-${site}`);
  if (btn) { btn.disabled = true; btn.innerHTML = '<span style="border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;width:11px;height:11px;animation:spin .6s linear infinite;display:inline-block;vertical-align:middle"></span> Connecting…'; }
  const name = getSiteName(site);
  appendLog(`Opening browser for ${name}…`, 'info', 'sites-log');
  try {
    await api('POST', `/api/login/${site}/sso`);
    toast(`Connected to ${name}!`, 'success');
    appendLog(`✓ Connected to ${name}`, 'success', 'sites-log');
    await renderSites();
    await refreshConnectedSites();
  } catch(e) {
    // For custom sites: offer a manual "mark as connected" fallback
    if (isCustom) {
      appendLog(`Auto-detection timed out for ${name}. If you signed in, use "I've signed in" below.`, 'warning', 'sites-log');
      if (btn) {
        btn.disabled = false;
        btn.style.display = 'none';
      }
      // Insert a fallback button next to the card
      const action = btn?.closest('.site-card-action');
      if (action && !action.querySelector('.force-connect-btn')) {
        const fb = document.createElement('div');
        fb.style.cssText = 'display:flex;flex-direction:column;gap:5px;align-items:flex-end';
        fb.innerHTML = `
          <button class="btn btn-sm force-connect-btn" style="background:#FEF3C7;color:#92400E;border:1px solid #FCD34D;font-size:11.5px"
            onclick="forceConnect('${site}','${name}')">✓ I've signed in</button>
          <button class="btn btn-sm" style="background:transparent;color:var(--muted);border:1px solid var(--border);font-size:11px"
            onclick="siteConnect('${site}',true)">Retry</button>`;
        action.appendChild(fb);
      }
    } else {
      toast(`Could not connect: ${e.message}`, 'error');
      appendLog(`✗ ${name}: ${e.message}`, 'error', 'sites-log');
      if (btn) { btn.disabled = false; btn.textContent = 'Connect'; }
    }
  }
}

async function forceConnect(site, name) {
  try {
    await api('POST', `/api/sites/custom/${site}/force-connect`);
    toast(`${name} marked as connected ✓`, 'success');
    appendLog(`✓ ${name} connected (manual)`, 'success', 'sites-log');
    await renderSites();
    await refreshConnectedSites();
  } catch(e) { toast(e.message, 'error'); }
}

async function siteDisconnect(site, isCustom = false) {
  const name = getSiteName(site);
  if (!confirm(`Disconnect ${name}?`)) return;
  try {
    await api('DELETE', `/api/credentials/${site}`);
    toast(`${name} disconnected`, 'success');
    await renderSites();
    await refreshConnectedSites();
  } catch(e) { toast(e.message, 'error'); }
}

async function loadSavedSearches() {
  try {
    const searches = await api('GET', '/api/saved-searches');
    const el = document.getElementById('saved-search-list');
    if (!el) return;
    if (!searches.length) {
      el.innerHTML = '<div style="color:var(--muted);font-size:13px">No saved searches yet.</div>';
      return;
    }
    el.innerHTML = searches.map(s => `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);margin-bottom:8px">
        <div>
          <div style="font-weight:600;font-size:13px">${esc(s.name)}</div>
          <div style="font-size:12px;color:var(--muted)">${esc(s.keywords)}${s.location ? ' · ' + esc(s.location) : ''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <button class="btn btn-secondary btn-sm" onclick="runSavedSearch(${JSON.stringify(s).replace(/"/g,'&quot;')})">Use</button>
          <button class="btn btn-danger btn-sm" onclick="deleteSavedSearch(${s.id})">Delete</button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('saved-search-list').innerHTML = '<div style="color:var(--red);font-size:12px">Failed to load saved searches.</div>';
  }
}

async function deleteSavedSearch(id) {
  try {
    await api('DELETE', `/api/saved-searches/${id}`);
    toast('Saved search removed', 'success');
    loadSavedSearches();
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function saveCurrentSearch() {
  const name = document.getElementById('saved-search-name')?.value.trim() || 'Saved Search';
  const query = document.getElementById('f-nl')?.value.trim();
  if (!query) {
    toast('Enter a search query first', 'warning');
    return;
  }
  const checked = [...document.querySelectorAll('.chip input:checked')].map(i => i.value);
  const payload = {
    name,
    keywords: query,
    location: document.getElementById('filter-kw')?.value ? '' : '',
    sites: checked,
    filters: {}
  };
  try {
    await api('POST', '/api/saved-searches', payload);
    toast('Saved search created', 'success');
    document.getElementById('saved-search-name').value = '';
    loadSavedSearches();
  } catch (e) {
    toast(e.message, 'error');
  }
}

function runSavedSearch(search) {
  const input = document.getElementById('f-nl');
  if (input) input.value = search.keywords + (search.location ? ', ' + search.location : '');
  const chips = document.querySelectorAll('.chip input');
  chips.forEach(box => { box.checked = (search.sites || []).includes(box.value); box.parentElement.classList.toggle('on', box.checked); });
  if (search.keywords) runSearch();
}

async function loadReminders() {
  try {
    const reminders = await api('GET', '/api/reminders?status=pending');
    const el = document.getElementById('reminder-list');
    if (!el) return;
    if (!reminders.length) {
      el.innerHTML = '<div style="color:var(--muted);font-size:13px">No upcoming reminders.</div>';
      return;
    }
    el.innerHTML = reminders.map(r => `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);margin-bottom:8px">

        </div>
        <button class="btn btn-primary btn-sm" onclick="markReminderDone(${r.id})">Done</button>
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('reminder-list').innerHTML = '<div style="color:var(--red);font-size:12px">Failed to load reminders.</div>';
  }
}

async function markReminderDone(id) {
  try {
    await api('PATCH', `/api/reminders/${id}/done`);
    toast('Reminder marked done', 'success');
    loadReminders();
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function clearAllJobs() {
  if (!confirm('Delete all stored jobs? This cannot be undone. Run a new search to repopulate.')) return;
  try {
    const r = await api('DELETE', '/api/jobs/all');
    toast(r.message || 'Jobs cleared', 'success');
    jobs = [];
    if (currentPage === 'feed') loadFeedJobs();
    refreshStats();
    renderDataTab(); // refresh count
  } catch(e) {
    toast('Failed: ' + e.message, 'error');
  }
}

  if (!nw) { toast('Enter a new password', 'warning'); return; }
  try {
    await api('POST', `/api/profiles/${profileId}/set-password`, { current_password: cur, password: nw });
    toast('Password set', 'success');
    renderProfileTab();
  } catch(e) { toast(e.message || 'Failed', 'error'); }
}

async function removeAccountPassword(profileId) {
  const cur = document.getElementById('sec-cur-pw')?.value || '';
  if (!confirm('Remove the password from this account?')) return;
  try {
    await api('POST', `/api/profiles/${profileId}/set-password`, { current_password: cur, password: '' });
    toast('Password removed', 'success');
    renderProfileTab();
  } catch(e) { toast(e.message || 'Incorrect current password', 'error'); }
}

function addSkill(e) {
  if (e.key !== 'Enter' && e.key !== ',') return;
  e.preventDefault();
  const v = e.target.value.replace(',','').trim();
  if (v && !profileSkills.includes(v)) { profileSkills.push(v); rebuildSkills(); }
  e.target.value = '';
}
function rmSkill(s) { profileSkills = profileSkills.filter(x=>x!==s); rebuildSkills(); }
function rebuildSkills() {
  const sw = document.getElementById('sw');
  if (!sw) return;
  sw.innerHTML = profileSkills.map(s=>`<span class="skill-tag">${esc(s)}<button onclick="rmSkill('${esc(s)}')" type="button">×</button></span>`).join('') +
    `<input class="skill-input" id="si" placeholder="Type skill, press Enter" onkeydown="addSkill(event)">`;
  document.getElementById('si')?.focus();
}

async function saveProfile() {
  const data = {
    full_name: document.getElementById('p-name').value,
    email: document.getElementById('p-email').value,
    phone: document.getElementById('p-phone').value,
    location: document.getElementById('p-location').value,
    linkedin_url: document.getElementById('p-li').value,
    github_url: document.getElementById('p-gh').value,
    current_title: document.getElementById('p-cur').value,
    desired_title: document.getElementById('p-des').value,
    years_experience: parseInt(document.getElementById('p-exp').value)||0,
    desired_salary: document.getElementById('p-sal').value,
    resume_path: document.getElementById('p-res').value,
    skills: profileSkills,
    summary: document.getElementById('p-sum').value,
  };
  try { await api('POST', '/api/profile', data); toast('Profile saved', 'success'); }
  catch(e) { toast(e.message, 'error'); }
}

async function uploadResume(input) {
  const file = input.files[0];
  if (!file) return;
  const label = input.closest('label');
  if (label) { label.style.opacity = '.5'; label.style.pointerEvents = 'none'; }
  const fnEl = document.getElementById('resume-filename');

  try {
    // Step 1 — upload file
    if (fnEl) fnEl.innerHTML = '<span style="color:var(--muted)">Uploading…</span>';
    const fd = new FormData();
    fd.append('file', file);
    const r = await fetch(`${API}/api/upload-resume`, { method: 'POST', body: fd });
    if (!r.ok) throw new Error((await r.json()).detail || 'Upload failed');
    const data = await r.json();
    document.getElementById('p-res').value = data.path;
    if (fnEl) fnEl.innerHTML = `📄 <strong>${esc(file.name)}</strong>`;

    // Step 2 — save just the resume path (don't touch other fields)
    if (fnEl) fnEl.innerHTML = `📄 <strong>${esc(file.name)}</strong> <span style="color:var(--muted);font-size:12px">— saving…</span>`;
    const existingProfile = await api('GET', '/api/profile').catch(() => ({}));
    await api('POST', '/api/profile', { ...existingProfile, resume_path: data.path, skills: existingProfile.skills || [] });

    // Step 3 — extract everything from the resume with Claude
    if (fnEl) fnEl.innerHTML = `📄 <strong>${esc(file.name)}</strong> <span style="color:var(--blue);font-size:12px">— reading with AI…</span>`;
    await parseResume();

    if (fnEl) fnEl.innerHTML = `📄 <strong>${esc(file.name)}</strong> <span style="color:var(--green);font-size:12px">— profile filled ✓</span>`;
  } catch(e) {
    toast(`Resume error: ${e.message}`, 'error');
    if (fnEl) fnEl.innerHTML = `<span style="color:var(--red)">Error: ${esc(e.message)}</span>`;
  } finally {
    if (label) { label.style.opacity = '1'; label.style.pointerEvents = ''; }
  }
}

function clearResume() {
  document.getElementById('p-res').value = '';
  const fnEl = document.getElementById('resume-filename');
  if (fnEl) fnEl.innerHTML = '<span style="color:var(--muted)">No file uploaded</span>';
  toast('Resume removed', 'success');
}

async function parseResume() {
  const btn = document.getElementById('parse-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Parsing…'; }
  try {
    const r = await api('POST', '/api/ai/parse-resume');
    const ext = r.extracted;
    // Merge non-empty extracted values into the form
    if (ext.full_name) document.getElementById('p-name').value = ext.full_name;
    if (ext.email) document.getElementById('p-email').value = ext.email;
    if (ext.phone) document.getElementById('p-phone').value = ext.phone;
    if (ext.location) document.getElementById('p-location').value = ext.location;
    if (ext.linkedin_url) document.getElementById('p-li').value = ext.linkedin_url;
    if (ext.github_url) document.getElementById('p-gh').value = ext.github_url;
    if (ext.current_title) document.getElementById('p-cur').value = ext.current_title;
    if (ext.years_experience) document.getElementById('p-exp').value = ext.years_experience;
    if (ext.summary) document.getElementById('p-sum').value = ext.summary;
    if (ext.skills?.length) { profileSkills = [...new Set([...profileSkills, ...ext.skills])]; rebuildSkills(); }
    // Auto-save the extracted data immediately
    await saveProfile();
    toast('Profile filled from resume ✓', 'success');
  } catch(e) {
    toast(`Parse failed: ${e.message}`, 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> Re-parse Resume'; }
  }
}
